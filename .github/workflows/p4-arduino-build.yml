name: P4 Stage Engine (Arduino) build and host tests

# Added for MISSION 001E; corrected in MISSION 001G. Does not replace
# p4-stage-engine-build.yml, which targets a path (stage-engine/esp32-p4) that
# does not exist in this repository.
#
# Shell: every job uses `shell: bash`, which runs `bash --noprofile --norc -eo
# pipefail {0}`. The GitHub default on Linux is `bash -e {0}` WITHOUT pipefail,
# which let a failing arduino-cli pass through `| tee` and report success.

on:
  push:
    branches: ["fix/**", "main"]
    paths:
      - "firmware/stage-engine-p4/**"
      - "firmware/c3-emergency-node/**"
      - "firmware/s3-comms-controller/**"
      - "firmware/shared-node/**"
      - "firmware/shared-pixel/**"
      - "firmware/director-esp32-8048s050/**"
      - "protocol/**"
      - "tools/**"
      - ".github/workflows/p4-arduino-build.yml"
      - ".github/problem-matchers/gcc.json"
  pull_request:
    paths:
      - "firmware/stage-engine-p4/**"
      - "firmware/c3-emergency-node/**"
      - "firmware/s3-comms-controller/**"
      - "firmware/shared-node/**"
      - "firmware/shared-pixel/**"
      - "firmware/director-esp32-8048s050/**"
      - "protocol/**"
      - "tools/**"
      - ".github/workflows/p4-arduino-build.yml"
      - ".github/problem-matchers/gcc.json"
  workflow_dispatch:

env:
  SKETCH_DIR: firmware/stage-engine-p4/ShowduinoStageEngineP4
  FQBN: "esp32:esp32:esp32p4:PSRAM=enabled,FlashSize=16M,ChipVariant=postv3"
  ESP32_CORE: "3.3.11"
  BOARD_INDEX: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: Host tests (policy only, not firmware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Latch and station policy suite (-Werror)
        run: bash tools/emergency-latch-tests/run_tests.sh
      - name: Emergency button suite (-Werror)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iprotocol \
            tools/emergency-button-tests/test_emergency_button.cpp -o /tmp/btn
          /tmp/btn
      - name: "Director emergency sheet suite (no -Werror; pre-existing snprintf warning)"
        run: |
          g++ -std=c++17 -Wall -Wextra -Iprotocol \
            tools/director-tests/test_emergency_sheet.cpp -o /tmp/sheet
          /tmp/sheet
      - name: OpenSSL headers for the HMAC reference (host tests only)
        run: |
          if ! echo '#include <openssl/evp.h>' | g++ -x c++ -fsyntax-only - 2>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev
          fi
          openssl version
      - name: Wireless station integration suite (-Werror; MISSION 001H/001I/001J)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iprotocol \
            tools/emergency-station-integration-tests/test_station_integration.cpp -lcrypto -o /tmp/station_it
          /tmp/station_it
      - name: Station authentication and replay suite (-Werror; MISSION 001J)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iprotocol \
            tools/emergency-auth-tests/test_station_auth.cpp -lcrypto -o /tmp/station_auth
          /tmp/station_auth
      - name: Director clear authentication suite (-Werror; MISSION 001K)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iprotocol \
            tools/emergency-director-tests/test_director_auth.cpp -lcrypto -o /tmp/director_auth
          /tmp/director_auth
      - name: Emergency Node protocol suite (-Werror)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iprotocol \
            tools/emergency-node-tests/test_emergency_node.cpp -o /tmp/estop_node
          /tmp/estop_node
      - name: Station / Director auth mutation check (MISSION 001J/001K)
        run: bash tools/emergency-auth-tests/run_mutations.sh

  build-current:
    name: Compile P4 Stage Engine (this commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.1.1"
      - name: Install ESP32 core ${{ env.ESP32_CORE }}
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "$BOARD_INDEX"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE}"
          arduino-cli core list
      - name: Compile sketch
        run: |
          test -f protocol/showduino_emergency_engage.h
          test -f protocol/showduino_station_blockers.h
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          # pipefail: a failing arduino-cli fails this step, even through tee.
          arduino-cli compile --fqbn "$FQBN" --warnings default \
            --build-property "compiler.cpp.extra_flags=-I$GITHUB_WORKSPACE/protocol" \
            --build-property "compiler.c.extra_flags=-I$GITHUB_WORKSPACE/protocol" \
            --build-path build "$SKETCH_DIR" 2>&1 | tee compile.log
      - name: Compile diagnostics and size
        if: always()
        run: |
          errs=$(grep -cE ': (fatal )?error:' compile.log || true)
          warns=$(grep -cE ': warning:' compile.log || true)
          echo "::notice title=Compile diagnostics::errors=${errs} warnings=${warns}"
          grep -E 'Sketch uses|Global variables use' compile.log | while read -r l; do
            echo "::notice title=Size::${l}"
          done
      - name: Upload build log and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-arduino-current
          path: |
            compile.log
            build/*.bin
            build/*.elf
          if-no-files-found: warn

  build-baseline:
    name: Compile P4 Stage Engine (baseline a8b3cb8, for comparison)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8b3cb81af6f807993480066f1cd139cb9a30e08
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.1.1"
      - name: Install ESP32 core ${{ env.ESP32_CORE }}
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "$BOARD_INDEX"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE}"
      - name: Compile baseline sketch
        run: |
          arduino-cli compile --fqbn "$FQBN" --warnings default \
            --build-path build "$SKETCH_DIR" 2>&1 | tee compile.log
      - name: Compile diagnostics and size
        if: always()
        run: |
          errs=$(grep -cE ': (fatal )?error:' compile.log || true)
          warns=$(grep -cE ': warning:' compile.log || true)
          echo "::notice title=Baseline diagnostics::errors=${errs} warnings=${warns}"
          grep -E ': (fatal )?error:|: warning:' compile.log | head -20 | while read -r l; do
            echo "::warning title=Baseline diagnostic::${l}"
          done
          grep -E 'Sketch uses|Global variables use' compile.log | while read -r l; do
            echo "::notice title=Baseline size::${l}"
          done
      - name: Upload baseline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-arduino-baseline
          path: compile.log
          if-no-files-found: warn

  # MISSION 001J/001K: the C3 Emergency Node, the S3 Comms relay and the Director
  # are part of the emergency trust chain, so all three are compiled. "baseline"
  # compiles the same sketch at b3b3f95 (end of 001J) to separate pre-existing build
  # problems from new ones. Director library versions are not pinned in the repo:
  # LVGL 9.2.2 and the current GFX Library for Arduino are a CI assumption.
  build-stations:
    name: Compile ${{ matrix.target }} (${{ matrix.ref_name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ref_name == 'baseline' }}
    strategy:
      fail-fast: false
      matrix:
        target: [c3-emergency-node, s3-comms-controller, director-s3]
        ref_name: [this-commit, baseline]
        include:
          - target: c3-emergency-node
            sketch: firmware/c3-emergency-node/ShowduinoC3EmergencyNode
            fqbn: "esp32:esp32:esp32c3:CDCOnBoot=cdc,FlashMode=dio"
            libs: "Adafruit NeoPixel;Adafruit SSD1306;Adafruit GFX Library"
          - target: s3-comms-controller
            sketch: firmware/s3-comms-controller/ShowduinoS3CommsController
            fqbn: "esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=8M,PSRAM=opi,PartitionScheme=default_8MB"
            libs: ""
          - target: director-s3
            sketch: firmware/director-esp32-8048s050/ShowduinoDirector8048S050
            fqbn: "esp32:esp32:esp32s3:CDCOnBoot=default,USBMode=default,FlashSize=16M,FlashMode=qio,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
            libs: "lvgl@9.2.2;GFX Library for Arduino;TAMC_GT911;Adafruit NeoPixel"
            lvconf: firmware/director-esp32-8048s050/ShowduinoDirector8048S050/lv_conf.h
          - ref_name: this-commit
            ref: ""
          - ref_name: baseline
            ref: b3b3f959d6904f306c74c494d72046001b7e81ef
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.1.1"
      - name: Install ESP32 core ${{ env.ESP32_CORE }} and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "$BOARD_INDEX"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE}"
          if [ -n "${{ matrix.libs }}" ]; then
            arduino-cli lib update-index
            IFS=';' read -ra LIBS <<< "${{ matrix.libs }}"
            arduino-cli lib install "${LIBS[@]}"
            arduino-cli lib list
          fi
          if [ -n "${{ matrix.lvconf }}" ]; then
            # LVGL is compiled as a library; it finds lv_conf.h next to its folder.
            libdir="$(arduino-cli config get directories.user)/libraries"
            cp "${{ matrix.lvconf }}" "$libdir/lv_conf.h"
            ls -la "$libdir"
          fi
      - name: Compile ${{ matrix.target }}
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json" || true
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" --warnings default \
            --build-property "compiler.cpp.extra_flags=-I$GITHUB_WORKSPACE/protocol" \
            --build-property "compiler.c.extra_flags=-I$GITHUB_WORKSPACE/protocol" \
            --build-path build "${{ matrix.sketch }}" 2>&1 | tee compile.log
      - name: Compile diagnostics and size
        if: always()
        run: |
          errs=$(grep -cE ': (fatal )?error:' compile.log || true)
          warns=$(grep -cE ': warning:' compile.log || true)
          echo "::notice title=${{ matrix.target }} ${{ matrix.ref_name }} diagnostics::errors=${errs} warnings=${warns}"
          # grep exits 1 when nothing matches; with pipefail that must not fail the step.
          { grep -E ': (fatal )?error:|: warning:' compile.log || true; } | head -30 | while read -r l; do
            echo "::warning title=${{ matrix.target }} diagnostic::${l}"
          done
          { grep -E 'Sketch uses|Global variables use' compile.log || true; } | while read -r l; do
            echo "::notice title=${{ matrix.target }} ${{ matrix.ref_name }} size::${l}"
          done
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.ref_name }}
          path: compile.log
          if-no-files-found: warn
